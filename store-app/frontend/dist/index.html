    <script>
      /*
       * Product-page priming. Measured, not guessed: Lighthouse put 4,776 ms of
       * the product page's LCP into "load delay", because the image could not
       * be discovered until the JS bundle had downloaded AND the API had
       * answered — a three-hop chain of HTML → JS → API → image.
       *
       * This starts the API request from the HTML itself, in parallel with the
       * bundle, and injects the image preload the moment the response lands.
       *
       * It is the ONE fetch() outside src/lib/api.ts, and it is deliberate: the
       * whole point is to run before any module has loaded. `lib/api.ts` still
       * owns every response — it adopts this promise rather than re-requesting.
       */
      (function () {
        var match = location.pathname.match(/^(?:\/en)?\/products\/([^/]+)\/?$/)
        if (!match) return
        // Same address lib/api.ts builds, so it adopts this response.
        var url = '/api/products/' + match[1] + '/' + (/^\/en\//.test(location.pathname) ? '?lang=en' : '')
        window.__nasaimPreload = {
          url: url,
          promise: fetch(url, { credentials: 'include', headers: { Accept: 'application/json' } })
            .then(function (response) {
              return response.ok ? response.json() : null
            })
            .then(function (body) {
              var image = body && body.data && body.data.images && body.data.images[0]
              if (!image) return body
              var renditions = image.renditions || {}
              var link = document.createElement('link')
              link.rel = 'preload'
              link.as = 'image'
              link.href = renditions.medium || image.url
              /*
               * The candidate list and `sizes` must match <ProductGallery>'s
               * <img> exactly. Preloading a bare `medium` while the img's
               * srcset chose `full` downloaded BOTH files — measured in the
               * Lighthouse network log — which is worse than no preload.
               */

                link.imageSrcset = renditions.medium + ' 600w, ' + renditions.full + ' 1200w'
                link.imageSizes = '(max-width: 1024px) 100vw, 600px'
              }
              link.fetchPriority = 'high'
              document.head.appendChild(link)
              return body
            })
            .catch(function () {
              return null
            }),
