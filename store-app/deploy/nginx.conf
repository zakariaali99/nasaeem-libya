# نسائم ليبيا — nginx.
#
# nginx serves the built SPA from disk and proxies /api to gunicorn. It does not
# execute JavaScript. There is no Node process in this diagram, which is what
# makes Rule 1 satisfiable.

upstream nasaim_django {
    server 127.0.0.1:8000 fail_timeout=0;
}

server {
    listen 443 ssl http2;
    server_name nasaeem.ly www.nasaeem.ly;

    ssl_certificate     /etc/letsencrypt/live/nasaeem.ly/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nasaeem.ly/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    charset utf-8;
    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

    root /srv/nasaim/frontend/dist;

    # Hashed build assets never change under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Uploaded media, written by Django, served straight off disk.
    location /media/ {
        alias /srv/nasaim/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /django-static/ {
        alias /srv/nasaim/backend/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://nasaim_django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }

    location /django-admin/ {
        proxy_pass http://nasaim_django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA shell. nginx serves real files off disk (favicon, the built assets
    # matched above); everything else — every HTML navigation, including deep
    # links on refresh — falls through to Django, which returns index.html with
    # per-product <meta>/JSON-LD injected (apps.storefront.spa). No Node here:
    # gunicorn renders the shell, nginx never executes JavaScript.
    #
    # `= /` is proxied explicitly because `try_files $uri` on a bare "/" would
    # otherwise resolve the dist directory and serve the un-injected index.html.
    location = / {
        proxy_pass http://nasaim_django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri @spa_shell;
    }

    location @spa_shell {
        proxy_pass http://nasaim_django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name nasaeem.ly www.nasaeem.ly;
    return 301 https://$host$request_uri;
}
